server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Arquivos com o conteúdo no nome (gerados pelo build) nunca mudam: o navegador pode guardar.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Vídeos de fundo: guardados por um dia; o nginx já atende pedidos por trecho (necessário no iPhone).
  location /video/ {
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ =404;
  }

  error_page 404 /__spa-fallback.html;
}
